name: Build JRC Conversas SMS Flux

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact approved integration commit to build
        type: string
        required: true
      publish:
        description: Publish this reviewed revision to GHCR
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: jrc-conversas-registry-release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: claudiohideki/jrcconversa_hs-prevent
  IMAGE_TAG: sha-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  validate:
    uses: ./.github/workflows/validate-consolidated.yml
    with:
      expected_sha: ${{ inputs.expected_sha }}

  build-and-push:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      digest: ${{ steps.publish.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Confirm the checked out revision
        env:
          EXPECTED_SHA: ${{ github.sha }}
          APPROVED_SHA: ${{ inputs.expected_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$EXPECTED_SHA" = "$APPROVED_SHA"

      - name: Free runner space for the production image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Download validated source and SDK reference
        uses: actions/download-artifact@v4
        with:
          name: validated-source-${{ github.sha }}
          path: tmp/ci-evidence

      - name: Login GHCR
        if: inputs.publish
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the official image locally
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=JRC Conversas HS Prevent - SMS Flux
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Verify integrated code, SDK, assets and runtime before publication
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
        run: |
          python3 .github/scripts/verify_image.py "$IMAGE_REF" tmp/ci-evidence/source.json
          bash .github/scripts/smoke_image.sh "$IMAGE_REF"

      - name: Publish once without replacing an existing tag
        if: inputs.publish
        id: publish
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
        run: bash .github/scripts/publish_once.sh

      - name: Record the build and publication status
        env:
          PUBLISHED: ${{ inputs.publish }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          printf '### Imagem JRC Conversas\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf '`%s/%s:%s`\n\n' "$REGISTRY" "$IMAGE_NAME" "$IMAGE_TAG" >> "$GITHUB_STEP_SUMMARY"
          printf 'Source: `%s`\n\nPublished: `%s`\n' "$SOURCE_SHA" "$PUBLISHED" >> "$GITHUB_STEP_SUMMARY"
          if [ "$PUBLISHED" = "true" ]; then
            printf '\nCompose: `%s/%s@%s`\n' "$REGISTRY" "$IMAGE_NAME" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: built-image-evidence-${{ github.sha }}
          path: tmp/ci-evidence/
          retention-days: 14

  verify-published:
    if: inputs.publish
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: validated-source-${{ github.sha }}
          path: tmp/ci-evidence
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull by immutable digest on an independent runner
        env:
          DIGEST: ${{ needs.build-and-push.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          image="$REGISTRY/$IMAGE_NAME@$DIGEST"
          docker pull --platform linux/amd64 "$image"
          python3 .github/scripts/verify_image.py "$image" tmp/ci-evidence/source.json
          bash .github/scripts/smoke_image.sh "$image"
          printf 'Verified immutable image: `%s`\n' "$image" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-image-evidence-${{ github.sha }}
          path: tmp/ci-evidence/
          retention-days: 14
